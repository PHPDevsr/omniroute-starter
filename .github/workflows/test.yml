name: Test

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          OMNIROUTE_PORT=30128
          NEXT_PUBLIC_BASE_URL=http://localhost:30128
          OMNIROUTE_WS_BRIDGE_SECRET=ci-test-secret-12345678901234567890123456789012
          OMNIROUTE_MEMORY_MB=2048
          INITIAL_PASSWORD=ci-test-password-123
          EOF

      - name: Start services
        run: docker compose up -d

      - name: Wait for healthy
        run: |
          timeout 120s bash -c 'until docker compose ps omniroute | grep -q "(healthy)"; do sleep 2; done'

      - name: Verify health endpoint
        run: |
          curl -f -s http://127.0.0.1:30128/api/monitoring/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
