version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"        # Can be "daily", "weekly", or "monthly"
    open-pull-requests-limit: 6
    commit-message:
      prefix: "chore(action)"
    labels:
      - "actions"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"        # Can be "daily", "weekly", or "monthly"
    open-pull-requests-limit: 6
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "docker"
